name: Build Blade Arena APK

on:
  push:
    branches:
      - blade-arena-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Blade Arena
        run: unzip -q BladeArena-Android-V0.1-source.zip

      - name: Build debug APK
        working-directory: BladeArenaAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blade-Arena-Android-V0.1
          path: BladeArenaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
